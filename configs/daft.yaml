# Config for daftfusion.DAFTFusionModel: one DAFT block (Wolf et al. 2022) in
# the last layer4 bottleneck of each frozen ResNet3D branch. Trainable: the
# DAFT MLPs and the fc head (both initialized so step 0 == the baseline model).
# Run with: python train.py --config configs/daft.yaml
#
# NOTE: paths below mirror train_fusion_multihead_v2.yaml's known-working
# cluster locations. Confirm/update model_ckpt, tabular_csv, and the *_dirs
# paths against your own cluster environment before running.

paths:
  train_csv: /gpfs/data/prostatelab/processed_data/csv/data_split/pj_splits/train_split_April4_testpatient_removed_relabeled.csv
  valid_csv: /gpfs/data/prostatelab/processed_data/csv/data_split/pj_splits/val_split_April4_testpatient_removed_relabeled.csv
  test_csv: null
  data_dirs:
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_20240212
  dce_dirs: []
  extra_valid_csv: null

model:
  model: daft

daft:
  # raw: condition on the tabular vector directly (as in the DAFT paper).
  # encoder: condition on the frozen clinical MLP's 64-dim embedding
  #          (loaded from model_weights.clinical_ckpt).
  tabular_input: encoder
  bottleneck_factor: 8      # MLP hidden = (2048 + n_features) / factor
  scale: true
  shift: true
  activation: linear        # linear | tanh | sigmoid (applied to the scale)
  identity_init: true       # DAFT starts as an exact identity on the frozen features
  train_host_block: false   # also fine-tune layer4[-1]'s convs (BN stats stay frozen)
  # Late fusion of the clinical embedding alongside DAFT (see daft_late*.yaml).
  late_fusion: false
  init_from: baseline       # baseline | latefusion (latefusion needs late_fusion: true)
  late_clinical_dropout: 0
  freeze_head_epochs: 0     # train only DAFT for the first N epochs
  head_lr_scale: 0        # head LR = learning_rate * head_lr_scale

training:
  gpu: True
  epochs: 100
  batch_size: 16
  num_workers: 4
  seed: 42
  imbalance_strategy: weighted_loss
  class_weights: null # computed automatically from the training set
  stack_adc_b1500: True
  mode: cspca # pirads | gleason | tstage | cspca

data:
  series: ["axt2", "adc", "b1500"]
  augment: none
  noise_sigma_range: [0.0, 0.0]
  downsample_factors: [1]
  pirads_cutoff: 3
  mask_prostate: False
  normalize: true
  # The number of features is detected from this file automatically. With
  # daft.tabular_input: encoder it must be the same CSV the clinical_mlp run used.
  tabular_csv: '/gpfs/data/johnsonplab/moujan/prostate-dataset/tabular-data/2026-10-03-tabular-data-onehot-some-lesion-level.csv'

hyperparameters:
  learning_rate: 1e-4
  weight_decay: 0.0
  max_patience: 20   # early stopping: epochs without a new best val AUC
  lr_patience: 10     # LR scheduler: epochs without val_loss improvement before LR *= factor
  factor: 0.5
  dropout: 0.2

model_weights:
  save_weights: True
  save_weights_dir: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output/daft_pb_fixed_v1
  load_weights: True
  # Baseline (no clinical fusion) branched ResNet3D checkpoint. Initializes the
  # frozen backbone AND the fc head (same layer names); DAFT weights aren't in
  # it and keep their identity init.
  model_ckpt: /gpfs/data/prostatelab/Lakshita/experiments/cspca/epoch=02_AUC_best_val_pirads_auc=0.84_axt2_adc_b1500_baseline_cspca_pirads_cutoff_3.ckpt
  disable_gradient: False
  # Only used when daft.tabular_input is 'encoder'. Either the exported
  # clinical_encoder.pt or the raw clinical_mlp_*.ckpt works.
  clinical_ckpt: '/gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output/clinical_mlp_fixed_v1/clinical_mlp_fixed_v1/clinical_mlp_epoch=10_best_val_pirads_auc=0.851.ckpt'

logging:
  log_run: True
  project_name: lakshita_multimodal
  run_name: daft_pb_fixed_v1
  plot_roc: False
  plot_confusion_matrix: False
  plot_pirads_breakdown: False

debugging:
  debug: False
  preds_dir: '/gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output/daft_pb_fixed_v1'
  max_test_volumes: -1
  compute_gradcam: False
