# Comparison arm for CBAM + late fusion (cbamlate.CBAMLateFusion): joint
# training from the plain baseline. CBAM modules start at identity, the fusion
# MLP head (same as late fusion's) at default init, and both train together
# from epoch 0, with late-path clinical dropout to limit shortcutting through
# the late path.
# Compare its val AUC and gates/*_spread against the staged phase 1 -> 2 runs.
# Run with: python train.py --config configs/cbam_late_joint.yaml

paths:
  train_csv: /gpfs/data/prostatelab/processed_data/csv/data_split/pj_splits/train_split_tabular_only.csv
  valid_csv: /gpfs/data/prostatelab/processed_data/csv/data_split/pj_splits/val_split_tabular_only.csv
  test_csv: null
  data_dirs:
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_20240212
  dce_dirs: []
  extra_valid_csv: null

model:
  model: cbam_late

# MUST match the cbam: section of the run that produced the CBAM checkpoint
# (a mismatch is caught when the checkpoint loads).
cbam:
  placement: blocks        # blocks = CBAM in every bottleneck (original paper); post = once after layer4
  stages: [2, 3, 4]     # with placement: blocks, which ResNet stages get CBAM
  reduction: 16            # channel-MLP bottleneck ratio r
  kernel_size: 7           # spatial-attention conv kernel (7x7x7)
  spatial_clinical: film   # film = clinical scale/shift on the pooled maps; none = image-only spatial gate
  identity_init: true      # 2*sigmoid gates, zero-init -> each module starts as the identity

cbam_late:
  init_from: baseline           # backbone + head from the baseline checkpoint
  train_attention: true
  attention_lr_scale: 1.0       # CBAM trains from scratch, same LR as the CBAM run
  late_clinical_dropout: 0.5
  log_gate_stats: true

training:
  gpu: True
  epochs: 100
  batch_size: 16
  num_workers: 4
  seed: 42
  imbalance_strategy: weighted_loss
  class_weights: null # computed automatically from the training set
  stack_adc_b1500: True
  mode: cspca # pirads | gleason | tstage | cspca

data:
  series: ["axt2", "adc", "b1500"]
  augment: none
  noise_sigma_range: [0.0, 0.0]
  downsample_factors: [1]
  pirads_cutoff: 3
  mask_prostate: False
  normalize: true
  tabular_csv: '/gpfs/data/johnsonplab/moujan/prostate-dataset/tabular-data/2026-10-07-tabular-data-onehotnotpirads-some-lesion-level-fixed-prior-biopsy.csv'
  tabular_dims: 28
  add_missing_indicator: True

hyperparameters:
  learning_rate: 0.0001
  weight_decay: 0.02
  max_patience: 40
  lr_patience: 10
  factor: 0.5
  dropout: 0.2

model_weights:
  save_weights: True
  save_weights_dir: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output/cbam_late_joint_v1
  load_weights: True
  # Baseline (no clinical fusion) branched ResNet3D checkpoint, as in cbam.yaml.
  model_ckpt: /gpfs/data/prostatelab/Lakshita/experiments/cspca/epoch=02_AUC_best_val_pirads_auc=0.84_axt2_adc_b1500_baseline_cspca_pirads_cutoff_3.ckpt
  disable_gradient: False
  # Required here: with init_from: baseline the clinical encoder comes from this.
  clinical_ckpt: '/gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output/clinical_mlp_pjsplits_clinical_missing_v1/clinical_mlp_pjsplits_clinical_missing_v1/clinical_mlp_epoch=14_best_val_pirads_auc=0.851.ckpt'

logging:
  log_run: True
  project_name: lakshita_multimodal
  run_name: cbam-late-joint-v1
  plot_roc: False
  plot_confusion_matrix: False
  plot_pirads_breakdown: False

debugging:
  debug: False
  preds_dir: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output/cbam-late-joint-v1
  max_test_volumes: -1
  compute_gradcam: False
