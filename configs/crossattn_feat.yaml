# Cross-attention as a fusion strategy in its own right (NOT pretraining):
# crossattnfeat.CrossAttnFeatFusion with the clinical data reaching the
# prediction only through the cross-attention CLS features.
# Run with: python train.py --config configs/crossattn_feat.yaml
#
# Question: is cross-attention, by itself, a useful way to fuse the clinical
# data with the images? Compare its best val AUC against
#   - the image-only baseline (lower bound: cls_auc_gain logs this model's gain
#     over its own image head every epoch),
#   - late fusion (latefusion_flat.yaml; the bar to beat).
# Splits, tabular data, training and hyperparameters match latefusion_flat.yaml.
#
# Differences from configs/crossattn_feat_pretrain.yaml:
#   residual_query: true   the clinical tokens keep their own content, so the
#                          CLS can carry the clinical signal directly as well
#                          as clinically selected image content. With false the
#                          model could only use the clinical data through where
#                          it attends, which handicaps it as a fusion strategy.
#   train_head: true       the image head adapts to the attention features (at
#                          0.1x LR), as late fusion's head is trained on its
#                          inputs.

paths:
  train_csv: '/gpfs/data/johnsonplab/moujan/prostate-dataset/tabular-data/new-splits/2026-10-14-train-split.csv'
  valid_csv: '/gpfs/data/johnsonplab/moujan/prostate-dataset/tabular-data/new-splits/2026-10-14-val-split.csv'
  test_csv: null
  data_dirs:
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_backfill_updated_series_20260727
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_2024_data_20250408
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_20240212
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_4355848
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_4304779
  dce_dirs: []
  extra_valid_csv: null

model:
  model: crossattn_feat

xattn:
  dim: 128
  heads: 4
  layers: 1
  dropout: 0.1
  kv_pool: 2
  residual_query: true     # clinical tokens keep their content (see header)
  tap: layer4
  feature_mask_prob: 0.0
  cls_init_std: 1.0e-3     # small random init of the CLS input weights (must be > 0)
  train_head: true         # fine-tune the image head along with the attention
  head_lr_scale: 0.1       # head LR = 1e-5 with the learning_rate below
  lr_monitor: val_loss     # as latefusion_flat

training:
  gpu: True
  epochs: 100
  batch_size: 16
  num_workers: 4
  seed: 42
  imbalance_strategy: weighted_loss
  class_weights: null # computed automatically from the training set
  stack_adc_b1500: True
  mode: cspca # pirads | gleason | tstage | cspca

data:
  series: ["axt2", "adc", "b1500"]
  augment: none
  noise_sigma_range: [0.0, 0.0]
  downsample_factors: [1]
  pirads_cutoff: 3
  mask_prostate: False
  normalize: true
  tabular_csv: '/gpfs/data/johnsonplab/moujan/prostate-dataset/tabular-data/new-splits/2026-10-15-train-val-tabular-v1.csv'
  tabular_dims: 24
  add_missing_indicator: True

hyperparameters:
  learning_rate: 0.0001
  weight_decay: 0.0
  max_patience: 20   # early stopping: epochs without a new best val AUC
  lr_patience: 8     # LR scheduler: epochs without val_loss improvement before LR *= factor
  factor: 0.5
  dropout: 0.2

model_weights:
  save_weights: True
  save_weights_dir: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output_clean/xattn_feat_v1
  load_weights: True
  # Baseline (no clinical fusion) branched ResNet3D checkpoint the backbone
  # and image head are initialized from and then frozen (see on_train_start).
  model_ckpt: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/prostateMRI_classifier/output/resnet3d_cspca_train_v1/epoch=04_AUC_best_val_pirads_auc=0.84_axt2_adc_b1500_baseline_cspca_pirads_cutoff_3.ckpt
  disable_gradient: False
  # Not used by crossattn_feat (it tokenizes the raw clinical features).
  clinical_ckpt: null

logging:
  log_run: True
  project_name: tabular_fusion
  run_name: xattn_feat_v1
  plot_roc: False
  plot_confusion_matrix: False
  plot_pirads_breakdown: False

debugging:
  debug: False
  preds_dir: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output_clean/xattn_feat_v1
  max_test_volumes: -1
  compute_gradcam: False
