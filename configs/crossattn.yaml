# Config for Cross-attention version
# Run with: python train.py --config configs/crossattn.yaml
#
# NOTE: paths below mirror train_fusion_multihead_v2.yaml's known-working
# cluster locations. Confirm/update model_ckpt, tabular_csv, and the *_dirs
# paths against your own cluster environment before running.

paths:
  train_csv: /gpfs/data/prostatelab/processed_data/csv/data_split/pj_splits/train_split_tabular_only.csv
  valid_csv: /gpfs/data/prostatelab/processed_data/csv/data_split/pj_splits/val_split_tabular_only.csv
  test_csv: null
  data_dirs:
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_20240212
  dce_dirs: []
  extra_valid_csv: null

model:
  model: crossattn

xattn:
  dim: 128                 # token width for both clinical and image tokens
  heads: 4                 # attention heads (dim must be divisible by this)
  layers: 1                # fusion blocks; raise only if val AUC rewards it
  dropout: 0.1             # inside attention and the FFN
  kv_pool: 2               # pool H and W by 2 before tokenizing (~14k -> ~3.5k image tokens)
  residual_query: true     # set false for the "clinical only guides where to look" ablation
  feature_mask_prob: 0.0   # try 0.1 once the basic model trains
  train_fc: false          # keep the baseline image head frozen
  tap: layer4
  delta_init_std: 1.0e-3
  lr_monitor: val_auc

training:
  gpu: True
  epochs: 200
  batch_size: 16
  num_workers: 4
  seed: 42
  imbalance_strategy: weighted_loss
  class_weights: null # computed automatically from the training set
  stack_adc_b1500: True
  mode: cspca # pirads | gleason | tstage | cspca

data:
  series: ["axt2", "adc", "b1500"]
  augment: none
  noise_sigma_range: [0.0, 0.0]
  downsample_factors: [1]
  pirads_cutoff: 3
  mask_prostate: False
  normalize: true
  tabular_csv: '/gpfs/data/johnsonplab/moujan/prostate-dataset/tabular-data/2026-10-07-tabular-data-onehotnotpirads-some-lesion-level-fixed-prior-biopsy.csv'
  tabular_dims: 28
  add_missing_indicator: True

hyperparameters:
  learning_rate: 1.0e-4
  weight_decay: 0.0
  max_patience: 40   # early stopping: epochs without a new best val AUC
  lr_patience: 15     # LR scheduler: epochs without val_loss improvement before LR *= factor
  factor: 0.5
  dropout: 0.2

model_weights:
  save_weights: True
  save_weights_dir: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output/cross-attn-layer4-v1
  load_weights: True
  # Baseline (no clinical fusion) branched ResNet3D checkpoint the CBAM
  # backbone is initialized from and then frozen (see on_train_start).
  model_ckpt: /gpfs/data/prostatelab/Lakshita/experiments/cspca/epoch=02_AUC_best_val_pirads_auc=0.84_axt2_adc_b1500_baseline_cspca_pirads_cutoff_3.ckpt
  disable_gradient: False
  # Optional: path to a clinical-MLP checkpoint produced by mlpclinical.py.
  # If null, the frozen clinical encoder uses (frozen, untrained) random init.
  clinical_ckpt: '/gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output/clinical_mlp_pjsplits_clinical_missing_v1/clinical_mlp_pjsplits_clinical_missing_v1/clinical_mlp_epoch=14_best_val_pirads_auc=0.851.ckpt'

logging:
  log_run: True
  project_name: lakshita_multimodal
  run_name: cross-attn-layer4-v1
  plot_roc: False
  plot_confusion_matrix: False
  plot_pirads_breakdown: True

debugging:
  debug: False
  preds_dir: '/gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output/cross-attn-layer4-v1'
  max_test_volumes: -1
  compute_gradcam: False
