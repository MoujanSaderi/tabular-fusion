# Phase 2 of CBAM + late fusion (cbamlate.CBAMLateFusion).
# Resumes from the best phase-1 checkpoint and trains the CBAM modules at a
# lower LR than the head, so the gates can adapt to the clinical information
# now having its own path. Compare gates/*_spread against phase 1: if it falls
# toward zero, the attention is collapsing onto a fixed reweighting.
# Run with: python train.py --config configs/cbam_late_phase2.yaml

paths:
  train_csv: '/gpfs/data/johnsonplab/moujan/prostate-dataset/tabular-data/new-splits/2026-10-14-train-split.csv'
  valid_csv: '/gpfs/data/johnsonplab/moujan/prostate-dataset/tabular-data/new-splits/2026-10-14-val-split.csv'
  test_csv: null
  data_dirs:
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_backfill_updated_series_20260727
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_2024_data_20250408
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_filtered_20240212
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_4355848
    - /gpfs/data/prostatelab/processed_data/h5/t2_dwi_4304779
  dce_dirs: []
  extra_valid_csv: null

model:
  model: cbam_late

# MUST match the cbam: section of the run that produced the CBAM checkpoint
# (a mismatch is caught when the checkpoint loads).
cbam:
  placement: blocks        # blocks = CBAM in every bottleneck (original paper); post = once after layer4
  stages: [2, 3, 4]     # with placement: blocks, which ResNet stages get CBAM
  reduction: 16            # channel-MLP bottleneck ratio r
  kernel_size: 7           # spatial-attention conv kernel (7x7x7)
  spatial_clinical: film   # film = clinical scale/shift on the pooled maps; none = image-only spatial gate
  identity_init: true      # 2*sigmoid gates, zero-init -> each module starts as the identity

cbam_late:
  init_from: cbam_late          # a checkpoint of this model (phase 1)
  train_attention: true         # CBAM trains for the whole run
  attention_lr_scale: 0.2       # CBAM LR = 1e-5 with the learning_rate below
  late_clinical_dropout: 0.1    # try 0.3-0.5 if the gates' spread collapses
  log_gate_stats: true

training:
  gpu: True
  epochs: 100
  batch_size: 16
  num_workers: 4
  seed: 42
  imbalance_strategy: weighted_loss
  class_weights: null # computed automatically from the training set
  stack_adc_b1500: True
  mode: cspca # pirads | gleason | tstage | cspca

data:
  series: ["axt2", "adc", "b1500"]
  augment: none
  noise_sigma_range: [0.0, 0.0]
  downsample_factors: [1]
  pirads_cutoff: 3
  mask_prostate: False
  normalize: true
  tabular_csv: '/gpfs/data/johnsonplab/moujan/prostate-dataset/tabular-data/new-splits/2026-10-15-train-val-tabular-v1.csv'
  tabular_dims: 24
  add_missing_indicator: True

hyperparameters:
  learning_rate: 0.00005   # head; it is already trained
  weight_decay: 0.01
  max_patience: 20
  lr_patience: 8
  factor: 0.5
  dropout: 0.1

model_weights:
  save_weights: True
  save_weights_dir: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output_clean/cbam_late_phase2_v1
  load_weights: True
  # TODO: the best checkpoint of the phase-1 run, e.g.
  # /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output/cbam_late_phase1_v1/cbam-late-phase1-v1/cbam_late_epoch=XX_best_val_pirads_auc=0.XXX.ckpt
  model_ckpt: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output_clean/cbam_late_phase1_v1/cbam_late_phase1_v1/cbam_late_epoch=21_best_val_pirads_auc=0.874.ckpt
  disable_gradient: False
  clinical_ckpt: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output-clean/clinical_mlp_v1/clinical_mlp_v1/clinical_mlp_epoch=26_best_val_pirads_auc=0.848.ckpt

logging:
  log_run: True
  project_name: tabular_fusion
  run_name: cbam_late_phase1_v2
  plot_roc: False
  plot_confusion_matrix: False
  plot_pirads_breakdown: False

debugging:
  debug: False
  preds_dir: /gpfs/data/johnsonplab/moujan/code/tabular-data-fusion/tabular-fusion/output_clean/cbam_late_phase2_v1
  max_test_volumes: -1
  compute_gradcam: False
